<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<style>
  text { font-family: JuliaMono, "Noto Sans Mono", monospace; fill:#172554; white-space:pre }
  .title{font-size:64px;font-weight:700}.sub{font-size:25px}.h{font-size:25px;font-weight:700}.hs{font-size:15px;fill:#475569}.body{font-size:16px}.code{font-size:31px;font-weight:600}.small{font-size:14px}.tiny{font-size:14px}.box{stroke-width:2}.call{fill:#fff;stroke:#8ab4f8;stroke-width:1.5}.arrow{stroke:#2455d6;stroke-width:2;fill:none;marker-end:url(#a)} .system{fill:#2563eb}.user{fill:#16a34a}.library{fill:#0891b2}.literal{fill:#111827}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2455d6"/></marker></defs>
<rect width="1800" height="1120" fill="#fff"/>
<!-- header -->
<text x="55" y="55" class="sub" font-style="italic">“Code is read more often than written.”</text>
<text x="810" y="72" text-anchor="middle" class="title">X̲ᵉTᵃL</text>
<text x="1030" y="43" class="h">Readable Syntax for Arrays, Functions, and Ideas</text>
<text x="1030" y="72" class="body">Typography shows what a name is, its origin, and how it is used.</text>

<!-- panels row 1 -->
<rect x="20" y="100" width="700" height="350" rx="12" fill="#eef7ff" stroke="#79b8ff" class="box"/>
<text x="40" y="137" class="h">1. Name Decorations</text><text x="40" y="160" class="hs">What a name is — and where it came from</text>
<text x="40" y="187" class="body">Rendered typography classifies names at a glance.</text>
<text x="70" y="230" class="code literal">x</text><text x="170" y="230" class="code system">r̲ev</text><text x="300" y="230" class="code user">ᵘs̲quare</text><text x="480" y="230" class="code library">ˡn̲orm</text><text x="600" y="230" class="code library">ᶜK̲</text>
<text x="55" y="275" class="small">variable</text><text x="155" y="275" class="small">system function</text><text x="295" y="275" class="small">user function</text><text x="465" y="275" class="small">library-local</text><text x="585" y="275" class="small">imported</text>
<text x="55" y="310" class="body">• Exactly one character is underlined in a function name.</text>
<text x="55" y="340" class="body">• Variables are not underlined.</text>
<text x="55" y="370" class="body">• Superscripts show origin: ᵘ user, ˡ library, ᶜ/ᵐ imported aliases.</text>
<text x="55" y="405" class="small">Unfamiliar superscript? Find the matching import.</text>

<rect x="740" y="100" width="500" height="350" rx="12" fill="#effcf1" stroke="#75c98a" class="box"/>
<text x="760" y="137" class="h">2. Library Imports</text><text x="760" y="160" class="hs">Choose an alias; provenance becomes visible</text>
<text x="760" y="190" class="code"><tspan class="literal">"c:" </tspan><tspan class="system">u̲se&lt;</tspan><tspan class="literal"> "Combinators"</tspan></text>
<text x="760" y="215" class="body">The trailing &lt; identifies the system macro.</text>
<text x="760" y="260" class="body">Imported names carry the chosen alias:</text>
<text x="830" y="315" class="code"><tspan class="library">ᶜK̲</tspan><tspan class="literal"> 42 17</tspan></text>
<text x="760" y="365" class="small">The superscript answers “where did this come from?”</text>

<rect x="1260" y="100" width="520" height="350" rx="12" fill="#fff8e8" stroke="#e9b95e" class="box"/>
<text x="1280" y="137" class="h">3. Definitions</text><text x="1280" y="160" class="hs">Functions, variables, binding, and lambdas</text>
<text x="1300" y="200" class="code"><tspan class="user">ᵘs̲quare</tspan><tspan class="literal"> ← { ω × ω }</tspan></text>
<text x="1300" y="245" class="code"><tspan class="literal">limit ← 100</tspan></text>
<text x="1300" y="295" class="code literal">x = 3</text>
<text x="1280" y="340" class="body">← binds a name; = is equality.</text>
<text x="1280" y="375" class="body">{ … } is a lambda; α/ω are left/right arguments.</text>
<text x="1280" y="410" class="small">Functions: one underlined character. Variables: none.</text>

<!-- row 2 -->
<rect x="20" y="470" width="570" height="300" rx="12" fill="#f3efff" stroke="#9a8de8" class="box"/>
<text x="40" y="507" class="h">4. Apply or Pass?</text><text x="40" y="530" class="hs">Juxtaposition applies; quote passes a function value</text>
<text x="70" y="575" class="code"><tspan class="literal">f̲ x</tspan></text><text x="270" y="575" class="code"><tspan class="literal">'f̲ </tspan><tspan class="system">e̲ach</tspan><tspan class="literal"> values</tspan></text>
<text x="55" y="610" class="body">Juxtaposition applies a function.</text>
<text x="55" y="640" class="body">A leading quote makes the function a value.</text>
<text x="70" y="700" class="code"><tspan class="system">'+ r̲/₂</tspan><tspan class="literal"> A</tspan></text>
<text x="55" y="740" class="small">Pass + to reduce; reduce along axis 2.</text>

<rect x="610" y="470" width="430" height="300" rx="12" fill="#fff0f6" stroke="#e58bb1" class="box"/>
<text x="630" y="507" class="h">5. Axes</text><text x="630" y="530" class="hs">Subscripts attach axes to functions</text>
<text x="650" y="575" class="code"><tspan class="system">r̲/</tspan><tspan class="literal"> A</tspan></text><text x="780" y="575" class="code"><tspan class="system">r̲/₂</tspan><tspan class="literal"> A</tspan></text><text x="910" y="575" class="code"><tspan class="system">o̲-₁₂</tspan><tspan class="literal"> A</tspan></text>
<text x="640" y="620" class="small">default</text><text x="785" y="620" class="small">axis 2</text><text x="900" y="620" class="small">axes 1 &amp; 2</text>
<text x="630" y="680" class="body"><tspan x="630" dy="0">The subscript belongs visually</tspan><tspan x="630" dy="22">to the function it modifies.</tspan></text>

<rect x="1060" y="470" width="430" height="300" rx="12" fill="#eef8ff" stroke="#79b8ff" class="box"/>
<text x="1080" y="507" class="h">6. Power</text><text x="1080" y="530" class="hs">Exponent for values; repetition for functions</text>
<text x="1110" y="580" class="code literal">x²</text><text x="1260" y="580" class="code"><tspan class="user">ᵘl̲ife⁴</tspan><tspan class="literal"> board</tspan></text>
<text x="1080" y="625" class="body">Value superscript → exponentiation.</text>
<text x="1080" y="660" class="body"><tspan x="1080" dy="0">Function superscript →</tspan><tspan x="1080" dy="22">repeated invocation.</tspan></text>
<text x="1080" y="720" class="small">Rendered form has no source caret.</text>

<rect x="1510" y="470" width="270" height="300" rx="12" fill="#effcf1" stroke="#75c98a" class="box"/>
<text x="1530" y="507" class="h">7. Lambdas</text><text x="1530" y="530" class="hs">α left • ω right</text>
<text x="1550" y="575" class="code literal">{ α + ω }</text>
<text x="1530" y="620" class="body">α = left argument</text>
<text x="1530" y="650" class="body">ω = right argument</text>
<text x="1530" y="700" class="small"><tspan x="1530" dy="0">Lambdas are ordinary</tspan><tspan x="1530" dy="18">function values.</tspan></text>

<!-- row 3 -->
<rect x="20" y="790" width="760" height="270" rx="12" fill="#fff8e8" stroke="#e9b95e" class="box"/>
<text x="40" y="827" class="h">8. System Names</text><text x="40" y="850" class="hs">APL quad + rendered function name</text>
<text x="40" y="875" class="body">Rendered forms: no ASCII underscores or [] pairs.</text>
<text x="55" y="915" class="code system">⎕N̲GET</text><text x="235" y="915" class="code system">⎕N̲PUT</text><text x="415" y="915" class="code system">⎕R̲EAD</text><text x="595" y="915" class="code system">⎕G̲RID</text>
<text x="55" y="945" class="small">read a file</text><text x="235" y="945" class="small">write a file</text><text x="415" y="945" class="small">read a typed line</text><text x="595" y="945" class="small">draw cells (SVG)</text>
<text x="55" y="995" class="code system">⎕P̲ATH</text><text x="235" y="995" class="code system">⎕S̲HOW</text>
<text x="55" y="1025" class="small">draw a line (SVG)</text><text x="235" y="1025" class="small">show a picture</text><text x="415" y="995" style="font-size:18px;font-weight:600"><tspan class="literal">flyover ← </tspan><tspan class="system">⎕S̲HOW ⎕G̲RID</tspan><tspan class="user"> ᵘp̲ass</tspan><tspan class="literal"> 11</tspan></text>

<rect x="800" y="790" width="420" height="270" rx="12" fill="#f3efff" stroke="#9a8de8" class="box"/>
<text x="820" y="827" class="h">9. ? and HOFs</text><text x="820" y="850" class="hs">Guards, predicates, HOFs</text>
<text x="840" y="890" class="code literal">n ≤ 1 ? 1◆ n × f̲ n</text>
<text x="820" y="925" class="body">? is a guard; ◆ (typed ;) separates.</text>
<text x="840" y="970" class="code system">e̲mpty?</text>
<text x="820" y="1010" class="body"><tspan x="820" dy="0">? can also end a function name,</tspan><tspan x="820" dy="21">as predicate punctuation.</tspan></text>
<text x="820" y="1050" class="small">No operator class: HOFs take quoted functions.</text>

<rect x="1240" y="790" width="540" height="270" rx="12" fill="#fff1ee" stroke="#e5a094" class="box"/>
<text x="1260" y="827" class="h">10. Input → Display</text><text x="1260" y="850" class="hs">ASCII source becomes readable typography</text>
<text x="1270" y="870" class="small">ASCII input</text><text x="1530" y="870" class="small">Rendered</text>
<text x="1270" y="890" class="body">r_ev</text><text x="1460" y="890" class="body">→</text><text x="1530" y="890" class="body system">r̲ev</text>
<text x="1270" y="920" class="body">u:s_quare</text><text x="1460" y="920" class="body">→</text><text x="1530" y="920" class="body user">ᵘs̲quare</text>
<text x="1270" y="950" class="body">[]R_EAD</text><text x="1460" y="950" class="body">→</text><text x="1530" y="950" class="body system">⎕R̲EAD</text>
<text x="1270" y="980" class="body">[]G_RID</text><text x="1460" y="980" class="body">→</text><text x="1530" y="980" class="body system">⎕G̲RID</text>
<text x="1270" y="1010" class="body">u:l_ife^4</text><text x="1460" y="1010" class="body">→</text><text x="1530" y="1010" class="body user">ᵘl̲ife⁴</text>
<text x="1270" y="1040" class="body">r_/_2</text><text x="1460" y="1040" class="body">→</text><text x="1530" y="1040" class="body system">r̲/₂</text>

<rect x="20" y="1080" width="1760" height="28" rx="5" fill="#e6f3ff"/>
<text x="900" y="1102" text-anchor="middle" class="body" font-weight="700">See the structure. Know the meaning. Read more, understand sooner.</text>
</svg>
