# One shared target directory for every component workspace under
# components/: cargo finds this file by walking up from where it runs,
# and `target-dir` is relative to this file's directory, so all builds
# land in ./target (the reg-rs goldens run ./target/debug/xetal).
[build]
target-dir = "target"

# The live demo runs the evaluator on the browser's stack (WebAssembly has
# no threads): give it room for deep recursion (TTTML trains recursively).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=67108864"]

# Lighter debuginfo for every dev build: line tables only, enough for
# panics and error locations. Measured 2026-10-18 on the CLI: a full
# rebuild 287 s -> 252 s; a rebuild after touching xetal-base 210 s
# either way (the crate chain's compile time, not debuginfo, is the
# critical path there).
[profile.dev]
debug = "line-tables-only"
