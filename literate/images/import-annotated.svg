<svg xmlns="http://www.w3.org/2000/svg" width="584" height="534" viewBox="0 0 584 534">
<style>
.code { font: 32px JuliaMono, 'DejaVu Sans Mono', Menlo, Consolas, monospace; white-space: pre; font-variant-ligatures: none }
.typed { font: 16px JuliaMono, 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill: #4a5160; font-variant-ligatures: none }
.inline { font-family: JuliaMono, 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-variant-ligatures: none }
.heading { font: bold 26px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2330 }
.title { font: bold 14.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2330 }
.note { font: 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3a4150 }
.box { fill: #f7f8fa; stroke: #d9dce1 }
.leader { fill: none; stroke-width: 1.6 }
.mark { stroke-width: 3; stroke-linecap: round }
</style>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="30" y="48" class="heading">Importing a library</text>
<text x="30" y="82" class="typed">as typed: &quot;c:&quot; u_se&lt; &quot;Combinators&quot;</text>
<rect x="76.0" y="298.0" width="432.0" height="72" rx="10" fill="#1e2127"/>
<text x="100.0" y="345.0" class="code" fill="#22b8c8">ᶜ⁼</text>
<text x="138.4" y="345.0" class="code" fill="#e0b400">u̲se&lt;</text>
<text x="234.4" y="345.0" class="code" fill="#e8d27a">&quot;Combinators&quot;</text>
<path d="M158.0 220.0 C158.0 255.0 119.2 255.0 119.2 290.0" class="leader" stroke="#22b8c8"/>
<line x1="102.0" y1="290.0" x2="136.4" y2="290.0" class="mark" stroke="#22b8c8"/>
<rect x="30.0" y="110.0" width="256.0" height="110.0" rx="8" class="box"/>
<rect x="30.0" y="110.0" width="5" height="110.0" rx="2" fill="#22b8c8"/>
<text x="46.0" y="133.0" class="title">The alias</text>
<text x="46.0" y="151.0" class="note">The prefix this file will write</text>
<text x="46.0" y="169.0" class="note">the library's names with:</text>
<text x="46.0" y="187.0" class="note"><tspan class="inline">c:K_</tspan>, <tspan class="inline">c:B_</tspan>. Drawn raised,</text>
<text x="46.0" y="205.0" class="note">joined to the macro.</text>
<path d="M426.0 238.0 C426.0 264.0 359.2 264.0 359.2 290.0" class="leader" stroke="#e8d27a"/>
<line x1="236.4" y1="290.0" x2="482.0" y2="290.0" class="mark" stroke="#e8d27a"/>
<rect x="298.0" y="110.0" width="256.0" height="128.0" rx="8" class="box"/>
<rect x="298.0" y="110.0" width="5" height="128.0" rx="2" fill="#e8d27a"/>
<text x="314.0" y="133.0" class="title">The library</text>
<text x="314.0" y="151.0" class="note">A name (a built-in standard</text>
<text x="314.0" y="169.0" class="note">library, or <tspan class="inline">Name.xtl</tspan> beside</text>
<text x="314.0" y="187.0" class="note">the file or on <tspan class="inline">XETAL_PATH</tspan>) or</text>
<text x="314.0" y="205.0" class="note">a path. Library names are</text>
<text x="314.0" y="223.0" class="note">capitalized.</text>
<path d="M292.0 430.0 C292.0 404.0 176.8 404.0 176.8 378.0" class="leader" stroke="#e0b400"/>
<line x1="140.4" y1="378.0" x2="213.2" y2="378.0" class="mark" stroke="#e0b400"/>
<rect x="30.0" y="430.0" width="524.0" height="74.0" rx="8" class="box"/>
<rect x="30.0" y="430.0" width="5" height="74.0" rx="2" fill="#e0b400"/>
<text x="46.0" y="453.0" class="title">The use macro</text>
<text x="46.0" y="471.0" class="note">A name ending in <tspan class="inline">&lt;</tspan> runs before the program is checked: it brings</text>
<text x="46.0" y="489.0" class="note">the library in. Drawn bold yellow, as every macro.</text>
</svg>
