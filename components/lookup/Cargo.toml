# X_eTaL component `lookup`: one Cargo workspace (see docs/architecture.md).

[workspace]
resolver = "3"
members = ["crates/xetal-lookup", "crates/xetal-sigs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/X_eTaL"

[workspace.dependencies]
xetal-base = { path = "../base/crates/xetal-base" }
xetal-store = { path = "../base/crates/xetal-store" }
xetal-sources = { path = "../macro/crates/xetal-sources" }
xetal-libs = { path = "../macro/crates/xetal-libs" }
xetal-lookup = { path = "crates/xetal-lookup" }
xetal-sigs = { path = "crates/xetal-sigs" }
xetal-ty = { path = "../types/crates/xetal-ty" }
xetal-prim-types = { path = "../types/crates/xetal-prim-types" }
