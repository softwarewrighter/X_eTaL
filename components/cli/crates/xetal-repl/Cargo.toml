[package]
name = "xetal-repl"
description = "An interactive session: persistent definitions and types"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["terminal"]
# The session on standard input, with the line editor on a terminal.
terminal = ["dep:xetal-line", "xetal-line/terminal"]

[dependencies]
xetal-linter.workspace = true
xetal-store.workspace = true
xetal-base.workspace = true
xetal-core.workspace = true
xetal-types.workspace = true
xetal-eval.workspace = true
xetal-line = { workspace = true, optional = true }
xetal-program.workspace = true
