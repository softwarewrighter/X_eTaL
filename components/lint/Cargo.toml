# X_eTaL component `lint`: one Cargo workspace (see docs/architecture.md).
# The `xetal lint` driver: levels from the command line and `# lint:`
# comments applied to the lints xetal-lint finds (docs/lint.md).

[workspace]
resolver = "3"
members = ["crates/xetal-linter", "crates/xetal-origin", "crates/xetal-typed", "crates/xetal-shape", "crates/xetal-strings", "crates/xetal-macrolint"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/X_eTaL"

[workspace.dependencies]
xetal-base = { path = "../base/crates/xetal-base" }
xetal-lint = { path = "../core/crates/xetal-lint" }
xetal-lex = { path = "../syntax/crates/xetal-lex" }
xetal-ir = { path = "../core/crates/xetal-ir" }
xetal-lex = { path = "../syntax/crates/xetal-lex" }
xetal-program = { path = "../macro/crates/xetal-program" }
xetal-sources = { path = "../macro/crates/xetal-sources" }
xetal-linter = { path = "crates/xetal-linter" }
xetal-origin = { path = "crates/xetal-origin" }
xetal-strings = { path = "crates/xetal-strings" }
xetal-macrolint = { path = "crates/xetal-macrolint" }
xetal-doccom = { path = "../doc/crates/xetal-doccom" }
xetal-contract = { path = "../expand/crates/xetal-contract" }
xetal-typed = { path = "crates/xetal-typed" }
xetal-shape = { path = "crates/xetal-shape" }
xetal-catalog = { path = "../base/crates/xetal-catalog" }
xetal-core = { path = "../core/crates/xetal-core" }
xetal-types = { path = "../types/crates/xetal-types" }
