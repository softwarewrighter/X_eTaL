# X_eTaL component `line`: one Cargo workspace (see docs/architecture.md).

[workspace]
resolver = "3"
members = ["crates/xetal-line"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/X_eTaL"

[workspace.dependencies]
xetal-complete = { path = "../complete/crates/xetal-complete" }
xetal-libs = { path = "../macro/crates/xetal-libs" }
xetal-tty = { path = "../console/crates/xetal-tty" }
xetal-base = { path = "../base/crates/xetal-base" }
xetal-lex = { path = "../syntax/crates/xetal-lex" }
xetal-render = { path = "../render/crates/xetal-render" }
xetal-view = { path = "../view/crates/xetal-view" }
xetal-buffer = { path = "../tui/crates/xetal-buffer" }
xetal-keys = { path = "../tui/crates/xetal-keys", default-features = false }
xetal-line = { path = "crates/xetal-line" }
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "macros", "std", "layout-cache", "underline-color"] }
