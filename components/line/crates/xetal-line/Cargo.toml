[package]
name = "xetal-line"
description = "The REPL's line editor: type ASCII, see the line decorated as you type, with history"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["terminal"]
# Reading lines and keys on a terminal (crossterm).
terminal = ["dep:ratatui", "ratatui/crossterm", "xetal-keys/crossterm"]

[dependencies]
xetal-tty.workspace = true
ratatui = { workspace = true, optional = true }
xetal-view.workspace = true
xetal-buffer.workspace = true
xetal-keys.workspace = true
xetal-complete.workspace = true
xetal-libs.workspace = true
