# X_eTaL component `tui`: one Cargo workspace (see docs/architecture.md).

[workspace]
resolver = "3"
members = ["crates/xetal-buffer", "crates/xetal-keys", "crates/xetal-panes", "crates/xetal-term"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Michael A Wright"]
repository = "https://github.com/softwarewrighter/X_eTaL"

[workspace.dependencies]
xetal-base = { path = "../base/crates/xetal-base" }
xetal-lex = { path = "../syntax/crates/xetal-lex" }
xetal-render = { path = "../render/crates/xetal-render" }
xetal-view = { path = "../view/crates/xetal-view" }
xetal-buffer = { path = "crates/xetal-buffer" }
xetal-keys = { path = "crates/xetal-keys" }
xetal-panes = { path = "crates/xetal-panes" }
xetal-term = { path = "crates/xetal-term" }
ratatui = "0.30"
proptest = "1"
