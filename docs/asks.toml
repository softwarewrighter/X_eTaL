# The asks the sibling repositories filed (each one's docs/xetal-asks.md),
# with their state in this repository. scripts/asks.py turns this into
# docs/asks.md, running each repro against this build: `repro` is a
# program, `works` a whole line its output shows once the ask is met, with
# no error ("" for "runs without an error"; `error[code]` when the ask is
# an error that should be reported). A landed ask's repro must pass; a planned
# or declined one whose repro starts passing is flagged to mark landed.
# `golden` names a reg-rs golden that pins the ask instead of a repro.
# The X_eTaL-demos and X_eTaL-games asks carry no numbers there; the D
# numbers follow this repository's plan.md, the G numbers are given here
# (each new row of theirs takes the next number, in the order of their
# table). X_eTaL-gpu numbers its own asks G1, G2, ...; since G is taken by
# X_eTaL-games here, they are GPU1, GPU2, ... in this ledger (GPU7 is its
# G7). X_eTaL-fpga's F numbers and the others' are their own.
#
# state: landed, partly landed, planned, declined, new (not yet triaged)
#
# A [[notice]] (title, text) is a change here that every sibling
# repository should act on; it is printed after the summary.

[[notice]]
title = "write a library's helpers with h:"
text = """
A library's top-level function written without a prefix is
deprecated: it still works and stays private, but every run warns
`deprecated-private` ("write h:j_oin; bare top-level functions in a
library are deprecated"). Write such helpers with `h:` (`h:j_oin :=
...`, and `h:j_oin` where they are used): an `h:` name is visible in
its own file only, in an app or a library alike, and is never part of
what the file offers (`xetal type`, `xetal doc`). Bare variables are
unchanged, and so are a lambda's local functions.

`xetal migrate FILE` prints the library with each bare top-level
function and its uses written `h:`, comments and layout kept; a
lambda's own local of the same name stays bare. To migrate in place:
`bin/xetal migrate lib/Foo.xtl > tmp && mv tmp lib/Foo.xtl`. At the
time of writing that is X_eTaL-games (about 32 functions in 4
libraries), X_eTaL-extensions (6 in 2), X_eTaL-demos (4 in 1),
X_eTaL-ML (2 in 1) and X_eTaL-gpu (1 in 1). After one release the
warning becomes an error. See `docs/private-names.md`.
"""

[[notice]]
title = "a name is bound once: write a! for one that changes, _ := for a value you discard"
text = """
A variable without `!` is bound once in its scope: `a := 42` then
`a := 43` in the same scope (a file's top level, or a lambda's body
with its parameters) is now `error[rebind]`. A lambda's parameter or
local named like an outer variable still shadows it. To migrate:

- a value kept only for its effect (`said := p_rint! ...`,
  `ok := ...`, `shown := []S_HOW ...`): write `_ := ...`, which runs it
  and keeps nothing; `_` may repeat;
- a value that changes step by step (state threaded through a game, an
  accumulator): write `s! := ...` (a `!` parameter works too:
  `{ s! -> s! := s! + 1; s! }`), or a fresh name per step, or a tuple
  pattern for state that travels together;
- a temporary name reused for something else: rename it.

In the REPL, `[]E_X "a"` unbinds `a` so it can be bound again; a
program cannot use it. A survey on 2026-10-08 counted about 210 such
bindings in the siblings: X_eTaL-extensions 93, X_eTaL-games 85,
X_eTaL-gpu 17, X_eTaL-ML 10, X_eTaL-libraries 10, X_eTaL-demos 3.
"""

