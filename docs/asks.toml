# The asks the sibling repositories filed (each one's docs/xetal-asks.md),
# with their state in this repository. scripts/asks.py turns this into
# docs/asks.md, running each repro against this build: `repro` is a
# program, `works` a whole line its output shows once the ask is met, with
# no error ("" for "runs without an error"; `error[code]` when the ask is
# an error that should be reported). A landed ask's repro must pass; a planned
# or declined one whose repro starts passing is flagged to mark landed.
# `golden` names a reg-rs golden that pins the ask instead of a repro.
# The X_eTaL-demos and X_eTaL-games asks carry no numbers there; the D
# numbers follow this repository's plan.md, the G numbers are given here.
#
# state: landed, partly landed, planned, declined, new (not yet triaged)

