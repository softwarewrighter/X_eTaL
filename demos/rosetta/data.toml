[source.sum]
apl2 = '+/V'
dyalog = '+/v'
j = '+/ v'
bqn = '+´ v'
xetal = "'+ r_/ v"
k = '+/v'
uiua = '/+ v'

[source.running-sum]
apl2 = '+\V'
dyalog = '+\v'
j = '+/\ v'
bqn = '+` v'
xetal = "'+ s_\\ v"
k = '+\v'
uiua = '\+ v'

[source.iota]
apl2 = '⍳N'
dyalog = '⍳n'
j = '>: i. n'
bqn = '1+↕n'
xetal = 'r_ange n'
k = '1+!n'
uiua = '+1⇡n'

[source.reshape]
apl2 = '2 3⍴V'
dyalog = '2 3⍴v'
j = '2 3 $ v'
bqn = '2‿3⥊v'
xetal = '2 3 r_eshape v'
k = '2 3#v'
uiua = '↯2_3 v'

[source.shape]
apl2 = '⍴A'
dyalog = '⍴a'
j = '$ a'
bqn = '≢a'
xetal = 's_hape a'
k = '(#a),#*a'
uiua = '△a'

[source.count]
apl2 = '↑⍴V'
dyalog = '≢v'
j = '# v'
bqn = '≠v'
xetal = 't_ally v'
k = '#v'
uiua = '⧻v'

[source.reverse]
apl2 = '⌽V'
dyalog = '⌽v'
j = '|. v'
bqn = '⌽v'
xetal = 'r_ev v'
k = '|v'
uiua = '⇌v'

[source.rotate]
apl2 = '1⌽V'
dyalog = '1⌽v'
j = '1 |. v'
bqn = '1⌽v'
xetal = '1 o_- v'
k = '1!v'
uiua = '↻1 v'

[source.transpose]
apl2 = '⍉A'
dyalog = '⍉a'
j = '|: a'
bqn = '⍉a'
xetal = 'o_\ a'
k = '+a'
uiua = '⍉a'

[source.outer]
apl2 = 'A∘.×B'
dyalog = 'a∘.×b'
j = 'a */ b'
bqn = 'a ×⌜ b'
xetal = "a '* t_able b"
k = 'a*/:\:b'
uiua = '⊞× a b'

[source.inner]
apl2 = 'A+.×B'
dyalog = 'a+.×b'
j = 'a +/ .* b'
bqn = 'a +˝∘×⎉1‿∞ b'
xetal = "a '+ '* i_nner b"
k = '+/a*b'
uiua = '/+×a b'

[source.each]
apl2 = 'F¨V'
dyalog = 'f¨v'
j = 'f"0 v'
bqn = 'F¨v'
xetal = "'f_ e_ach v"
k = "f'v"
uiua = '∵F v'

[source.swap]
dyalog = 'x f⍨ y'
j = 'x f~ y'
bqn = 'x F˜ y'
xetal = "x 'f_ s_wap y"
uiua = 'F : x y'

[source.compose]
dyalog = 'f∘g'
j = 'f@:g'
bqn = 'F∘G'
xetal = "'f_ 'g_ c_ompose x"
k = 'f g x'
uiua = 'F G x'

[source.power]
dyalog = 'f⍣3 ⊢x'
j = 'f^:3 x'
bqn = 'F⍟3 x'
xetal = 'f_^3 x'
k = 'f/[3;x]'
uiua = '⍥F 3 x'

[source.mean-train]
dyalog = '(+/÷≢)'
j = '(+/ % #)'
bqn = '(+´÷≠)'
xetal = "['+ r_/ / t_ally]"
k = '{(+/x)%#x}'
uiua = '÷⧻⟜/+'

[source.lambda]
dyalog = '{⍵×⍵}'
j = '{{ y*y }}'
bqn = '{𝕩×𝕩}'
xetal = '{ _r * _r }'
k = '{x*x}'
uiua = '×.'

[source.conditional]
apl2 = '→(X<0)/NEG'
dyalog = '{⍵<0:-⍵ ⋄ ⍵}'
j = '{{ if. y<0 do. -y else. y end. }}'
bqn = '{𝕩<0 ? -𝕩 ; 𝕩}'
xetal = '{ x -> x < 0 ? n_eg x; x }'
k = '{$[x<0;-x;x]}'
uiua = '⨬(∘|¯)<0.'

[source.self]
dyalog = '∇'
j = '$:'
bqn = '𝕊'
k = 'o'
uiua = '↬'

[source.index-of]
apl2 = 'V⍳X'
dyalog = 'v⍳x'
j = 'v i. x'
bqn = 'v⊐x'
xetal = 'v i_ndexOf x'
k = 'v?x'
uiua = '⊗x v'

[source.member]
apl2 = 'X∊V'
dyalog = 'x∊v'
j = 'x e. v'
bqn = 'x∊v'
xetal = 'x m_ember? v'
k = '(v?x)<#v'
uiua = '∊x v'

[source.match]
apl2 = 'A≡B'
dyalog = 'a≡b'
j = 'a -: b'
bqn = 'a≡b'
xetal = 'a m_atch b'
k = 'a~b'
uiua = '≍a b'

[source.where]
apl2 = 'B/⍳⍴B'
dyalog = '⍸b'
j = 'I. b'
bqn = '/b'
xetal = 'w_here b'
k = '&b'
uiua = '⊚b'

[source.sort]
apl2 = 'V[⍋V]'
dyalog = 'v[⍋v]'
j = '/:~ v'
bqn = '∧v'
xetal = 's_ort v'
k = 'v@<v'
uiua = '⍆v'

[source.format]
apl2 = '⍕V'
dyalog = '⍕v'
j = '": v'
bqn = '•Fmt v'
xetal = 'f_ormat v'
k = '$v'
uiua = '°⋕ v'

[source.numbers]
apl2 = '⍎T'
dyalog = '⍎t'
j = '". t'
bqn = '•ParseFloat t'
xetal = 'n_umbers t'
k = '.t'
uiua = '⋕ t'

[source.read-file]
dyalog = '⊃⎕NGET f'
j = '1!:1 < f'
bqn = '•FChars f'
xetal = '[]N_GET f'
k = '0:f'
uiua = '&fras f'

[source.read-line]
apl2 = '⍞'
dyalog = '⍞'
j = '1!:1 ] 1'
bqn = '•GetLine @'
xetal = '[]R_EAD @'
k = '0:0'
uiua = '&sc'

[source.print]
apl2 = '⎕←V'
dyalog = '⎕←v'
j = 'echo v'
bqn = '•Show v'
xetal = 'p_rint! v'
k = '`0:v'
uiua = '&p v'

[source.trap]
apl2 = '⎕EA'
dyalog = ':Trap / 0::'
j = 'try. catch. end.'
bqn = 'F⎊G'
k = '.[f;x;:]'
uiua = '⍣F G'
xetal = '"1 d_iv 0" t_ry< "@ r_ecover< \"-1\""'

[source.use]
apl2 = ')COPY WS'
dyalog = ')COPY / ⎕FIX'
j = "require 'x'"
bqn = '•Import "x.bqn"'
xetal = '"c:" u_se< "Combinators"'
k = '\l x.k'
uiua = '~"x.ua"'

