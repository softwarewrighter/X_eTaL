[notes.lambda]
apl2 = "none: every function is defined and named, ∇Z←SQ X"

[notes.swap]
apl2 = "not directly expressible"
k = "none: the arguments are written the other way round, y f x"

[notes.compose]
apl2 = "not directly expressible"
k = "no composition operator: the functions are applied in turn"

[notes.power]
apl2 = "not directly expressible"

[notes.mean-train]
apl2 = "not directly expressible"
k = "K has no trains; a lambda does it"

[notes.self]
apl2 = "the function's own name"
xetal = "its own name, or c:Y_ from the Combinators library"

[notes.read-file]
apl2 = "a shared variable ([]SVO) with a file processor"

[notes.inner]
k = "the dot product of two vectors"
uiua = "the dot product of two vectors"

[notes.member]
k = "no member primitive: the index found before the end"

[notes.read-line]
k = "the dialects differ"

[notes.shape]
k = "no shape primitive: the count, then the first row's"

[notes.transpose]
bqn = "a matrix"
k = "flip: + transposes a list of lists"

# Spans: how a cell is colored, "class text|class text|...", with the
# classes X_eTaL's []V_IEW names (number, string, symbol, builtin,
# variable, comment, keyword, function, operator, punct); a cell
# without spans is shown plain. A few to begin with.
[spans.rotate]
k = "number 1|symbol !|variable v"
j = "number 1|space  |builtin |.|space  |variable v"
uiua = "builtin ↻|number 1|space  |variable v"

[spans.reverse]
k = "symbol ||variable v"
j = "builtin |.|space  |variable v"
