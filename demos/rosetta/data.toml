# The Rosetta stone's data (docs/rosetta.md, lang-choices RS3): the
# idioms compared, and how each language writes them. Two axes, then
# their display names as lists in the same order, and four matrices
# keyed idiom then language: input (a binding the example runs with),
# source, output, notes. A missing cell is
# a face that says so; nothing here is ever run by the stone (the X_eTaL
# cells follow docs/idioms.md, whose spec case runs them). The K and
# Uiua cells were added from memory and are reviewed by the user.

idioms = ["sum", "running-sum", "iota", "reshape", "shape", "count", "reverse", "rotate", "transpose", "outer", "inner", "each", "swap", "compose", "power", "mean-train", "lambda", "conditional", "self", "index-of", "member", "match", "where", "sort", "format", "numbers", "read-file", "read-line", "print", "trap", "use"]
idiom_names = ["Sum", "Running sum", "1 to n", "Reshape", "Shape", "Count", "Reverse", "Rotate", "Transpose", "Outer product", "Inner product", "Each", "Swap arguments", "Compose", "Power (repeat)", "Train: the mean", "Anonymous function", "Conditional", "Self-reference", "Index of", "Membership", "Match", "Where", "Sort", "Number to text", "Text to numbers", "Read a file", "Read a line", "Print", "Trap an error", "Use a library"]
languages = ["apl2", "dyalog", "j", "bqn", "k", "uiua", "xetal"]
language_names = ["APL2", "Dyalog APL", "J", "BQN", "ngn/k", "Uiua", "X_eTaL"]

[input.sum]
bqn = 'v←1‿2‿3‿4'
uiua = "v ← [1 2 3 4]"
xetal = 'v := 1 2 3 4'

[input.running-sum]
bqn = 'v←1‿2‿3‿4'
uiua = "v ← [1 2 3 4]"
xetal = 'v := 1 2 3 4'

[input.iota]
bqn = 'n←5'
uiua = "n ← 5"
xetal = 'n := 5'

[input.reshape]
bqn = 'v←1‿2‿3‿4‿5‿6'
uiua = "v ← [1 2 3 4 5 6]"
xetal = 'v := 1 2 3 4 5 6'

[input.shape]
bqn = 'a←2‿3⥊1‿2‿3‿4‿5‿6'
uiua = "a ← ↯2_3 [1 2 3 4 5 6]"
xetal = 'a := 2 3 r_eshape 1 2 3 4 5 6'

[input.count]
bqn = 'v←3‿1‿4‿1‿5'
uiua = "v ← [3 1 4 1 5]"
xetal = 'v := 3 1 4 1 5'

[input.reverse]
bqn = 'v←"ABCDE"'
uiua = 'v ← "ABCDE"'
xetal = 'v := "ABCDE"'

[input.rotate]
bqn = 'v←"ABCDE"'
uiua = 'v ← "ABCDE"'
xetal = 'v := "ABCDE"'

[input.transpose]
bqn = 'a←2‿3⥊1‿2‿3‿4‿5‿6'
uiua = "a ← ↯2_3 [1 2 3 4 5 6]"
xetal = 'a := 2 3 r_eshape 1 2 3 4 5 6'

[input.index-of]
bqn = 'v←3‿1‿4 ⋄ x←4'
uiua = "v ← [3 1 4]\nx ← 4"
xetal = 'v := 3 1 4; x := 4'

[input.member]
bqn = 'x←2 ⋄ v←1‿2‿3'
uiua = "x ← 2\nv ← [1 2 3]"
xetal = 'x := 2; v := 1 2 3'

[input.match]
bqn = 'a←1‿2 ⋄ b←1‿2'
uiua = "a ← [1 2]\nb ← [1 2]"
xetal = 'a := 1 2; b := 1 2'

[input.where]
bqn = 'b←0‿1‿1‿0'
uiua = "b ← [0 1 1 0]"
xetal = 'b := 0 1 1 0'

[input.sort]
bqn = 'v←3‿1‿2'
uiua = "v ← [3 1 2]"
xetal = 'v := 3 1 2'

[input.format]
bqn = 'v←42'
uiua = "v ← 42"
xetal = 'v := 42'

[input.numbers]
bqn = 't←"3.5"'
uiua = 't ← "3.5"'
xetal = 't := "1 2 3"'

[input.outer]
xetal = 'a := 1 2 3; b := 1 2 3'
bqn = 'a←1‿2‿3 ⋄ b←1‿2‿3'
uiua = "a ← [1 2 3]\nb ← [1 2 3]"

[input.inner]
xetal = 'a := 1 2 3; b := 1 2 3'
bqn = 'a←1‿2‿3 ⋄ b←1‿2‿3'
uiua = "a ← [1 2 3]\nb ← [1 2 3]"

[input.each]
xetal = 'u:f_ := { x -> n_eg x }; v := 1 2 3'
bqn = 'F←- ⋄ v←1‿2‿3'
uiua = "F ← ¯\nv ← [1 2 3]"

[input.swap]
xetal = 'u:f_ := { x y -> x - y }; x := 1; y := 2'
bqn = 'F←- ⋄ x←1 ⋄ y←2'
uiua = "F ← -\nx ← 1\ny ← 2"

[input.compose]
xetal = 'u:f_ := { x -> n_eg x }; u:g_ := { x -> x * 2 }; x := 3'
bqn = 'F←- ⋄ G←×⟜2 ⋄ x←3'
uiua = "F ← ¯\nG ← ×2\nx ← 3"

[input.power]
xetal = 'u:f_ := { x -> x + 1 }; x := 0'
bqn = 'F←+⟜1 ⋄ x←0'
uiua = "F ← +1\nx ← 0"

[source.sum]
apl2 = '+/V'
dyalog = '+/v'
j = '+/ v'
bqn = '+´ v'
xetal = "'+ r_/ v"
k = '+/v'
uiua = '/+ v'

[source.running-sum]
apl2 = '+\V'
dyalog = '+\v'
j = '+/\ v'
bqn = '+` v'
xetal = "'+ s_\\ v"
k = '+\v'
uiua = '\+ v'

[source.iota]
apl2 = '⍳N'
dyalog = '⍳n'
j = '>: i. n'
bqn = '1+↕n'
xetal = 'r_ange n'
k = '1+!n'
uiua = '+1⇡n'

[source.reshape]
apl2 = '2 3⍴V'
dyalog = '2 3⍴v'
j = '2 3 $ v'
bqn = '2‿3⥊v'
xetal = '2 3 r_eshape v'
k = '2 3#v'
uiua = '↯2_3 v'

[source.shape]
apl2 = '⍴A'
dyalog = '⍴a'
j = '$ a'
bqn = '≢a'
xetal = 's_hape a'
k = '(#a),#*a'
uiua = '△a'

[source.count]
apl2 = '×/⍴V'
dyalog = '≢v'
j = '# v'
bqn = '≠v'
xetal = 't_ally v'
k = '#v'
uiua = '⧻v'

[source.reverse]
apl2 = '⌽V'
dyalog = '⌽v'
j = '|. v'
bqn = '⌽v'
xetal = 'r_ev v'
k = '|v'
uiua = '⇌v'

[source.rotate]
apl2 = '1⌽V'
dyalog = '1⌽v'
j = '1 |. v'
bqn = '1⌽v'
xetal = '1 o_- v'
k = '1!v'
uiua = '↻1 v'

[source.transpose]
apl2 = '⍉A'
dyalog = '⍉a'
j = '|: a'
bqn = '⍉a'
xetal = 'o_\ a'
k = '+a'
uiua = '⍉a'

[source.outer]
apl2 = 'A∘.×B'
dyalog = 'a∘.×b'
j = 'a */ b'
bqn = 'a ×⌜ b'
xetal = "a '* t_able b"
k = 'a*/:\:b'
uiua = '⊞× a b'

[source.inner]
apl2 = 'A+.×B'
dyalog = 'a+.×b'
j = 'a +/ .* b'
bqn = 'a +˝∘×⎉1‿∞ b'
xetal = "a '+ '* i_nner b"
k = '+/a*b'
uiua = '/+×a b'

[source.each]
apl2 = 'F¨V'
dyalog = 'f¨v'
j = 'f"0 v'
bqn = 'F¨v'
xetal = "'f_ e_ach v"
k = "f'v"
uiua = '≡F v'

[source.swap]
dyalog = 'x f⍨ y'
j = 'x f~ y'
bqn = 'x F˜ y'
xetal = "x 'f_ s_wap y"
uiua = '˜F x y'

[source.compose]
dyalog = 'f∘g'
j = 'f@:g'
bqn = 'F∘G x'
xetal = "'f_ 'g_ c_ompose x"
k = 'f g x'
uiua = 'F G x'

[source.power]
dyalog = 'f⍣3 ⊢x'
j = 'f^:3 x'
bqn = 'F⍟3 x'
xetal = 'f_^3 x'
k = 'f/[3;x]'
uiua = '⍥F 3 x'

[source.mean-train]
dyalog = '(+/÷≢)'
j = '(+/ % #)'
bqn = '(+´÷≠)'
xetal = "['+ r_/ / t_ally]"
k = '{(+/x)%#x}'
uiua = '÷⧻⟜/+'

[source.lambda]
dyalog = '{⍵×⍵}'
j = '{{ y*y }}'
bqn = '{𝕩×𝕩}'
xetal = '{ _r * _r }'
k = '{x*x}'
uiua = '˙×'

[source.conditional]
apl2 = '→(X<0)/NEG'
dyalog = '{⍵<0:-⍵ ⋄ ⍵}'
j = '{{ if. y<0 do. -y else. y end. }}'
bqn = '{𝕩<0 ? -𝕩 ; 𝕩}'
xetal = '{ x -> x < 0 ? n_eg x; x }'
k = '{$[x<0;-x;x]}'
uiua = '⨬(∘|¯)⊸<0'

[source.self]
dyalog = '∇'
j = '$:'
bqn = '𝕊'
k = 'o'

[source.index-of]
apl2 = 'V⍳X'
dyalog = 'v⍳x'
j = 'v i. x'
bqn = 'v⊐x'
xetal = 'v i_ndexOf x'
k = 'v?x'
uiua = '⊗ v x'

[source.member]
apl2 = 'X∊V'
dyalog = 'x∊v'
j = 'x e. v'
bqn = 'x∊v'
xetal = 'x m_ember? v'
k = '(v?x)<#v'
uiua = '∊ v x'

[source.match]
apl2 = 'A≡B'
dyalog = 'a≡b'
j = 'a -: b'
bqn = 'a≡b'
xetal = 'a m_atch b'
k = 'a~b'
uiua = '≍a b'

[source.where]
apl2 = 'B/⍳⍴B'
dyalog = '⍸b'
j = 'I. b'
bqn = '/b'
xetal = 'w_here b'
k = '&b'
uiua = '⊚b'

[source.sort]
apl2 = 'V[⍋V]'
dyalog = 'v[⍋v]'
j = '/:~ v'
bqn = '∧v'
xetal = 's_ort v'
k = 'v@<v'
uiua = '⍆v'

[source.format]
apl2 = '⍕V'
dyalog = '⍕v'
j = '": v'
bqn = '•Fmt v'
xetal = 'f_ormat v'
k = '$v'
uiua = '°⋕ v'

[source.numbers]
apl2 = '⍎T'
dyalog = '⍎t'
j = '". t'
bqn = '•ParseFloat t'
xetal = 'n_umbers t'
k = '.t'
uiua = '⋕ t'

[source.read-file]
dyalog = '⊃⎕NGET f'
j = '1!:1 < f'
bqn = '•FChars f'
xetal = '[]N_GET f'
k = '0:f'
uiua = '&fras f'

[source.read-line]
apl2 = '⍞'
dyalog = '⍞'
j = '1!:1 ] 1'
bqn = '•GetLine @'
xetal = '[]R_EAD @'
k = '0:0'
uiua = '&sc'

[source.print]
apl2 = '⎕←V'
dyalog = '⎕←v'
j = 'echo v'
bqn = '•Show v'
xetal = 'p_rint! v'
k = '`0:v'
uiua = '&p v'

[source.trap]
apl2 = '⎕EA'
dyalog = ':Trap / 0::'
j = 'try. catch. end.'
bqn = 'F⎊G'
k = '.[f;x;:]'
uiua = '⍣F G'
xetal = '"1 d_iv 0" t_ry< "@ r_ecover< \"-1\""'

[source.use]
apl2 = ')COPY WS'
dyalog = ')COPY / ⎕FIX'
j = "require 'x'"
bqn = '•Import "x.bqn"'
xetal = '"c:" u_se< "Combinators"'
k = '\l x.k'
uiua = '~"x.ua"'

