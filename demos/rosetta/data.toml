xetal = 'v := 1 2 3 4'

[input.running-sum]
xetal = 'v := 1 2 3 4'

[input.iota]
xetal = 'n := 5'

[input.reshape]
xetal = 'v := 1 2 3 4 5 6'

[input.shape]
xetal = 'a := 2 3 r_eshape 1 2 3 4 5 6'

[input.count]
xetal = 'v := 3 1 4 1 5'

[input.reverse]
xetal = 'v := "ABCDE"'

[input.rotate]
xetal = 'v := "ABCDE"'

[input.transpose]
xetal = 'a := 2 3 r_eshape 1 2 3 4 5 6'

[input.index-of]
xetal = 'v := 3 1 4; x := 4'

[input.member]
xetal = 'x := 2; v := 1 2 3'

[input.match]
xetal = 'a := 1 2; b := 1 2'

[input.where]
xetal = 'b := 0 1 1 0'

