<svg xmlns="http://www.w3.org/2000/svg" width="584" height="552" viewBox="0 0 584 552">
<style>
.code { font: 32px JuliaMono, 'DejaVu Sans Mono', Menlo, Consolas, monospace; white-space: pre; font-variant-ligatures: none }
.typed { font: 16px JuliaMono, 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill: #4a5160; font-variant-ligatures: none }
.inline { font-family: JuliaMono, 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-variant-ligatures: none }
.heading { font: bold 26px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2330 }
.title { font: bold 14.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2330 }
.note { font: 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3a4150 }
.box { fill: #f7f8fa; stroke: #d9dce1 }
.leader { fill: none; stroke-width: 1.6 }
.mark { stroke-width: 3; stroke-linecap: round }
</style>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="30" y="48" class="heading">Y, the sage bird: recursion</text>
<text x="30" y="82" class="typed">as typed: l:Y_ := { f_ -&gt; f_ l:Y_ 'f_ }</text>
<rect x="76.0" y="316.0" width="432.0" height="72" rx="10" fill="#1e2127"/>
<text x="100.0" y="363.0" class="code" fill="#22b8c8">ˡY̲</text>
<text x="157.6" y="363.0" class="code" fill="#e6e6e6">←</text>
<text x="196.0" y="363.0" class="code" fill="#e6e6e6">{</text>
<text x="234.4" y="363.0" class="code" fill="#5b9cff">f̲</text>
<text x="272.8" y="363.0" class="code" fill="#e6e6e6">→</text>
<text x="311.2" y="363.0" class="code" fill="#5b9cff">f̲</text>
<text x="349.6" y="363.0" class="code" fill="#22b8c8">ˡY̲</text>
<text x="407.2" y="363.0" class="code" fill="#5b9cff">'</text>
<text x="426.4" y="363.0" class="code" fill="#5b9cff">f̲</text>
<text x="464.8" y="363.0" class="code" fill="#e6e6e6">}</text>
<path d="M158.0 202.0 C158.0 255.0 244.0 255.0 244.0 308.0" class="leader" stroke="#5b9cff"/>
<line x1="236.4" y1="308.0" x2="251.6" y2="308.0" class="mark" stroke="#5b9cff"/>
<rect x="30.0" y="110.0" width="256.0" height="92.0" rx="8" class="box"/>
<rect x="30.0" y="110.0" width="5" height="92.0" rx="2" fill="#5b9cff"/>
<text x="46.0" y="133.0" class="title">The step</text>
<text x="46.0" y="151.0" class="note">A function that is handed the</text>
<text x="46.0" y="169.0" class="note">whole recursive function and</text>
<text x="46.0" y="187.0" class="note">makes one step with it.</text>
<path d="M426.0 256.0 C426.0 282.0 378.4 282.0 378.4 308.0" class="leader" stroke="#5b9cff"/>
<line x1="313.2" y1="308.0" x2="443.6" y2="308.0" class="mark" stroke="#5b9cff"/>
<rect x="298.0" y="110.0" width="256.0" height="146.0" rx="8" class="box"/>
<rect x="298.0" y="110.0" width="5" height="146.0" rx="2" fill="#5b9cff"/>
<text x="314.0" y="133.0" class="title">Y f is f (Y f)</text>
<text x="314.0" y="151.0" class="note">f is handed Y f. That does not</text>
<text x="314.0" y="169.0" class="note">loop forever because f's</text>
<text x="314.0" y="187.0" class="note">parameter is lazy (<tspan class="inline">~</tspan>), used</text>
<text x="314.0" y="205.0" class="note">only when needed. APL has no</text>
<text x="314.0" y="223.0" class="note">such operator: a dfn recurses</text>
<text x="314.0" y="241.0" class="note">with <tspan class="inline">∇</tspan>.</text>
<path d="M158.0 448.0 C158.0 422.0 368.8 422.0 368.8 396.0" class="leader" stroke="#22b8c8"/>
<line x1="351.6" y1="396.0" x2="386.0" y2="396.0" class="mark" stroke="#22b8c8"/>
<rect x="30.0" y="448.0" width="256.0" height="74.0" rx="8" class="box"/>
<rect x="30.0" y="448.0" width="5" height="74.0" rx="2" fill="#22b8c8"/>
<text x="46.0" y="471.0" class="title">Y itself</text>
<text x="46.0" y="489.0" class="note">The library's own name, used in</text>
<text x="46.0" y="507.0" class="note">its body: Y calls itself.</text>
<path d="M426.0 448.0 C426.0 422.0 426.4 422.0 426.4 396.0" class="leader" stroke="#5b9cff"/>
<line x1="409.2" y1="396.0" x2="443.6" y2="396.0" class="mark" stroke="#5b9cff"/>
<rect x="298.0" y="448.0" width="256.0" height="74.0" rx="8" class="box"/>
<rect x="298.0" y="448.0" width="5" height="74.0" rx="2" fill="#5b9cff"/>
<text x="314.0" y="471.0" class="title">Quoted</text>
<text x="314.0" y="489.0" class="note">The quote passes f as a value</text>
<text x="314.0" y="507.0" class="note">instead of applying it.</text>
</svg>
