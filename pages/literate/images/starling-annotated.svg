<svg xmlns="http://www.w3.org/2000/svg" width="641" height="516" viewBox="0 0 641 516">
<style>
.code { font: 32px JuliaMono, 'DejaVu Sans Mono', Menlo, Consolas, monospace; white-space: pre; font-variant-ligatures: none }
.typed { font: 16px JuliaMono, 'DejaVu Sans Mono', Menlo, Consolas, monospace; fill: #4a5160; font-variant-ligatures: none }
.inline { font-family: JuliaMono, 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-variant-ligatures: none }
.heading { font: bold 26px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2330 }
.title { font: bold 14.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2330 }
.note { font: 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #3a4150 }
.box { fill: #f7f8fa; stroke: #d9dce1 }
.leader { fill: none; stroke-width: 1.6 }
.mark { stroke-width: 3; stroke-linecap: round }
</style>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<text x="30" y="48" class="heading">S, the starling: one value used twice</text>
<text x="30" y="82" class="typed">as typed: l:S_ := { x_ y_ z -&gt; z x_ y_ z }</text>
<rect x="66.1" y="280.0" width="508.8" height="72" rx="10" fill="#1e2127"/>
<text x="90.1" y="327.0" class="code" fill="#22b8c8">ˡS̲</text>
<text x="147.7" y="327.0" class="code" fill="#e6e6e6">←</text>
<text x="186.1" y="327.0" class="code" fill="#e6e6e6">{</text>
<text x="224.5" y="327.0" class="code" fill="#5b9cff">x̲</text>
<text x="262.9" y="327.0" class="code" fill="#5b9cff">y̲</text>
<text x="301.3" y="327.0" class="code" fill="#e6e6e6">z</text>
<text x="339.7" y="327.0" class="code" fill="#e6e6e6">→</text>
<text x="378.1" y="327.0" class="code" fill="#e6e6e6">z</text>
<text x="416.5" y="327.0" class="code" fill="#5b9cff">x̲</text>
<text x="454.9" y="327.0" class="code" fill="#5b9cff">y̲</text>
<text x="493.3" y="327.0" class="code" fill="#e6e6e6">z</text>
<text x="531.7" y="327.0" class="code" fill="#e6e6e6">}</text>
<path d="M172.2 166.0 C172.2 219.0 253.3 219.0 253.3 272.0" class="leader" stroke="#5b9cff"/>
<line x1="226.5" y1="272.0" x2="280.1" y2="272.0" class="mark" stroke="#5b9cff"/>
<rect x="30.0" y="110.0" width="284.5" height="56.0" rx="8" class="box"/>
<rect x="30.0" y="110.0" width="5" height="56.0" rx="2" fill="#5b9cff"/>
<text x="46.0" y="133.0" class="title">Two functions</text>
<text x="46.0" y="151.0" class="note">x takes two arguments, y one.</text>
<path d="M468.8 220.0 C468.8 246.0 445.3 246.0 445.3 272.0" class="leader" stroke="#8a8f98"/>
<line x1="380.1" y1="272.0" x2="510.5" y2="272.0" class="mark" stroke="#8a8f98"/>
<rect x="326.5" y="110.0" width="284.5" height="110.0" rx="8" class="box"/>
<rect x="326.5" y="110.0" width="5" height="110.0" rx="2" fill="#8a8f98"/>
<text x="342.5" y="133.0" class="title">x z (y z)</text>
<text x="342.5" y="151.0" class="note">Then x with z on its left and y z</text>
<text x="342.5" y="169.0" class="note">on its right. J's hook <tspan class="inline">(f g) y</tspan>,</text>
<text x="342.5" y="187.0" class="note">BQN's <tspan class="inline">F⟜G</tspan>, Dyalog's train <tspan class="inline">(⊢ f</tspan></text>
<text x="342.5" y="205.0" class="note"><tspan class="inline">g)</tspan>.</text>
<path d="M172.2 412.0 C172.2 386.0 310.9 386.0 310.9 360.0" class="leader" stroke="#8a8f98"/>
<line x1="303.3" y1="360.0" x2="318.5" y2="360.0" class="mark" stroke="#8a8f98"/>
<rect x="30.0" y="412.0" width="284.5" height="56.0" rx="8" class="box"/>
<rect x="30.0" y="412.0" width="5" height="56.0" rx="2" fill="#8a8f98"/>
<text x="46.0" y="435.0" class="title">The value</text>
<text x="46.0" y="453.0" class="note">Given once, used twice.</text>
<path d="M468.8 412.0 C468.8 386.0 483.7 386.0 483.7 360.0" class="leader" stroke="#5b9cff"/>
<line x1="456.9" y1="360.0" x2="510.5" y2="360.0" class="mark" stroke="#5b9cff"/>
<rect x="326.5" y="412.0" width="284.5" height="74.0" rx="8" class="box"/>
<rect x="326.5" y="412.0" width="5" height="74.0" rx="2" fill="#5b9cff"/>
<text x="342.5" y="435.0" class="title">y z</text>
<text x="342.5" y="453.0" class="note">Right to left, first: y applied to</text>
<text x="342.5" y="471.0" class="note">z.</text>
</svg>
